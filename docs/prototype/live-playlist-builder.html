root.addEventListener('click',event=>{
 const option=event.target.closest('[data-pick-index]');
 if(option&&picker){const entry=picker.items[Number(option.dataset.pickIndex)];if(picker.multiple){picker.selected.has(entry.value)?picker.selected.delete(entry.value):picker.selected.add(entry.value)}else picker.selected=new Set([entry.value]);drawPicker(true);updatePickerSelection();return}
 const action=event.target.closest('[data-pick-act]')?.dataset.pickAct;
 if(action==='open')openPicker();else if(action==='cancel')closePicker();else if(action==='apply')closePicker(true);else if(action==='clear'){clearTimeout(pickerTimer);picker.query='';$('.lp-picker-search input').value='';filterPicker();$('.lp-picker-search input').focus()}
});
root.addEventListener('input',event=>{if(event.target.matches('.lp-picker-search input')){picker.query=event.target.value;clearTimeout(pickerTimer);pickerTimer=setTimeout(filterPicker,100)}});
root.addEventListener('change',event=>{if(event.target.dataset.edit==='field')delete edit.node.values;if(event.target.dataset.edit==='op'){if(event.target.value==='any')edit.node.values=edit.node.value?[edit.node.value]:[];else{if(edit.node.values)edit.node.value=edit.node.values[0]||'';delete edit.node.values}}},true);
root.addEventListener('keydown',event=>{
 if(!picker)return;
 if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closePicker();return}
 if(event.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(e=>e.getClientRects().length&&!e.closest('[hidden]')),first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}return}
 const index=event.target.dataset.pickIndex;if(index===undefined||!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;
 event.preventDefault();const next=Math.max(0,Math.min(picker.items.length-1,event.key==='Home'?0:event.key==='End'?picker.items.length-1:Number(index)+(event.key==='ArrowDown'?1:-1)));
 const vp=$('.lp-picker-viewport');if(next*58<vp.scrollTop)vp.scrollTop=next*58;else if((next+1)*58>vp.scrollTop+vp.clientHeight)vp.scrollTop=(next+1)*58-vp.clientHeight;drawPicker(true);$(`[data-pick-index="${next}"]`)?.focus({preventScroll:true});
});

render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(tweaks,'logicWords',{label:'Logic labels',options:['ALL / ANY','Every rule / Any rule']});tweak.addToggle(tweaks,'dense',{label:'Compact rule rows'})}
})();
</script>
