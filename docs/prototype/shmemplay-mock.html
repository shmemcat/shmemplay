    if(a==='membership-current'){menuIds=active()?.current?[active().current]:[];showMembership();return;}if(a==='membership'){showMembership();return;}

    if(a==='rules'){openRules();return;}if(a==='edit-rules'){openRules(detail.key);return;}
    if(a==='add-rule'||a==='add-group'){const node=nodeBy(b.dataset.node);const rule=()=>({id:`r${++ruleSeq}`,type:'rule',source:playlists.find(p=>p.kind==='file')?.id,include:true});node.children.push(a==='add-rule'?rule():{id:`g${++ruleSeq}`,type:'group',mode:'all',children:[rule()]});showRules();return;}

    if(a==='save-tags'){const t=tracks.get(modal.id);root.querySelectorAll('[data-tag]').forEach(input=>t[input.dataset.tag]=input.value);t.search=norm(`${t.title} ${t.artist} ${t.album} ${t.genre}`);libraryIds.sort((a,b)=>cmp(tracks.get(a).title,tracks.get(b).title));changed();closeModal();render();toast('Sample tags updated');return;}

  root.addEventListener('change',event=>{const el=event.target;if(el.matches('.sp-file-filter')){fileFilter=el.value;projectionKey='';$('.sp-viewport').scrollTop=0;render();}if(el.dataset.member){el.checked?memberPending.add(el.dataset.member):memberPending.delete(el.dataset.member);}if(el.dataset.policy){const q=qBy(modal.qid);q.policy[el.dataset.policy]=el.type==='checkbox'?el.checked:el.value;showPolicy(q.id);}if(el.dataset.pref)audioPrefs[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.rule){const n=nodeBy(el.dataset.rule);n[el.dataset.field]=el.dataset.field==='include'?el.value==='yes':el.value;showRules();}if(el.name==='output'){ruleOutput=el.value;showRules();}});
  root.addEventListener('input',event=>{const el=event.target;if(el.matches('.sp-search input')){const value=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(section==='queues'&&viewed())viewed().query=value;else query=value;projectionKey='';$('.sp-viewport').scrollTop=0;render();},80);}if(el.matches('.sp-rule-name'))ruleName=el.value;if(el.matches('.sp-seek input')){const q=active();if(q){q.position=Number(el.value);$('.sp-elapsed').textContent=dur(q.position);}}});
  $('.sp-overlay').addEventListener('click',event=>{if(event.target===$('.sp-overlay'))closeModal();});

  $('.sp-viewport').addEventListener('pointerdown',event=>{const row=event.target.closest('[data-track]');if(!row||event.button!==0)return;if(event.target.closest('.sp-grip')){drag={id:row.dataset.track,start:event.clientY,target:Number(row.dataset.index),moved:false};$('.sp-viewport').setPointerCapture(event.pointerId);event.preventDefault();return;}if(!event.target.closest('[data-act=song]'))return;press={x:event.clientX,y:event.clientY,id:row.dataset.track};press.timer=setTimeout(()=>{if(!press)return;selected.add(press.id);suppressClick=true;press=null;renderSelection();drawRows(true);drawIcons();},440);});
  $('.sp-viewport').addEventListener('pointermove',event=>{if(press&&Math.hypot(event.clientX-press.x,event.clientY-press.y)>8){clearTimeout(press.timer);press=null;}if(drag){if(Math.abs(event.clientY-drag.start)>5)drag.moved=true;const vp=$('.sp-viewport'),r=vp.getBoundingClientRect();if(event.clientY<r.top+28)vp.scrollTop-=15;if(event.clientY>r.bottom-28)vp.scrollTop+=15;drag.target=Math.max(0,Math.min(projection.items.length-1,Math.floor((event.clientY-r.top+vp.scrollTop-8)/rowSize())));root.querySelectorAll('.sp-drop').forEach(x=>x.classList.remove('sp-drop'));$(`[data-index="${drag.target}"]`)?.classList.add('sp-drop');}});
  function pointerEnd(){if(press){clearTimeout(press.timer);press=null;}if(drag){if(drag.moved){suppressClick=true;if(viewed()?.query){toast('Clear queue search to rearrange songs.');}else{moveEntry(viewed(),drag.id,drag.target);}drag=null;render();}else drag=null;}setTimeout(()=>suppressClick=false,40);}
  $('.sp-viewport').addEventListener('pointerup',pointerEnd);$('.sp-viewport').addEventListener('pointercancel',()=>{if(press)clearTimeout(press.timer);press=null;drag=null;root.querySelectorAll('.sp-drop').forEach(x=>x.classList.remove('sp-drop'));});
  const lane=$('.sp-fast');function fastMove(event){if(!fast)return;const rect=lane.getBoundingClientRect(),frac=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));fast.fraction=frac;const live=section==='queues'||section==='playlists';if(live){const vp=$('.sp-viewport');vp.scrollTop=frac*(vp.scrollHeight-vp.clientHeight);drawRows();$('.sp-bubble').hidden=true;}else{const target=projection.targets[Math.min(projection.targets.length-1,Math.floor(frac*projection.targets.length))];fast.target=target;const bubble=$('.sp-bubble');bubble.hidden=!target;if(target){bubble.textContent=target.label;bubble.style.top=`${Math.min(rect.height-55,Math.max(0,event.clientY-rect.top-27))}px`;}}}
  lane.addEventListener('pointerdown',event=>{event.preventDefault();lane.setPointerCapture(event.pointerId);fast={};lane.classList.add('sp-dragging');fastMove(event);});lane.addEventListener('pointermove',fastMove);function endFast(cancel=false){if(fast&&!cancel&&fast.target){$('.sp-viewport').scrollTop=Math.floor(fast.target.index/(projection.grid?ALBUM_COLUMNS:1))*rowSize();drawRows(true);}fast=null;lane.classList.remove('sp-dragging');$('.sp-bubble').hidden=true;updateFast();}lane.addEventListener('pointerup',()=>endFast());lane.addEventListener('pointercancel',()=>endFast(true));
